[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-assisted-one-to-one-music-lesson-scheduling"
version = "4.8.0"
description = "AI-Assisted One-to-One Music Lesson Scheduling — research demonstration"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["."]
include = ["modules*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
